[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simtrade"
version = "0.1.0"
description = "A high-performance paper trading simulation server with 1m OHLCV replay, margin policy enforcement, WebSocket/REST API, and web dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lei Zhang", email = "zhang.huanning@hotmail.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "websockets>=12.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "aiohttp>=3.9.0",
    "jinja2>=3.1.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
simtrade = "simtrade.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
